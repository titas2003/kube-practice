apiVersion: v1
kind: Pod
metadata:
  name: dir-pod
spec:
  containers:
    - name: dir-pod
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: vol-mount 
          mountPath: /usr/share/nginx/html
  volumes:
    - name: vol-mount
      hostPath:
        path: /tmp/html
        type: DirectoryOrCreate
